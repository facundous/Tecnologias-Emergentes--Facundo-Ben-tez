<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>App de noticias con Tailwind</title>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <style type="text/tailwindcss">
            @theme {
                --color-clifford: #da373d;
            }
        </style>
    </head>
    <body>
        <nav class="bg-blue-500 text-white p-4 mb-8 shadow">
            <div class="max-w-6xl mx-auto">
                <span class="text-xl font-bold">Noticias</span>
            </div>
        </nav>

        <div class="max-w-6xl mx-auto px-4">

            <p id="loading" class="text-center text-gray-600">Cargando noticias...</p>

            <div id="noticias" class="grid grid-cols-3 gap-6"></div>

        </div>
        <script>
            fetch('https://jsonplaceholder.typicode.com/posts?_limit=9')
                .then(respuesta => respuesta.json())
                .then(datos => mostrarNoticias(datos));

            function mostrarNoticias(posts) {
                document.getElementById('loading').style.display = 'none';
                const contenedor = document.getElementById('noticias');

                posts.forEach(post => {
                const tarjeta = document.createElement('div');
                tarjeta.className = 'bg-white rounded-lg shadow-md p-5';

                tarjeta.innerHTML = `
                    <h2 class="text-lg font-semibold text-gray-800">${post.title}</h2>
                    <p class="text-gray-600 text-sm">${post.body}</p>
                `;
                contenedor.appendChild(tarjeta);
                });
            }
        </script>

        

    </body>
    
</html>
