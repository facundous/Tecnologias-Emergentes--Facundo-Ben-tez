<!DOCTYPE HTML>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>App con bootstrap con bootstrap</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <body>
        <h1 class="text-center text-primary">Tarea4 con bootstrap</h1>
        <nav class="navbar navbar-dark bg-primary mb-4">
            <div class="container">
                <span class="navbar-brand mb-0 h1">Noticias</span>
            </div>
        </nav>

        <div class="container">
            <div id="loading" class="text-center my-5">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2">Cargando noticias</p>
            </div>
        <div id="noticias" class="row g-4"></div>
        </div>
        <script>
            fetch('https://jsonplaceholder.typicode.com/posts?_limit=9')
                .then(respuesta => respuesta.json())
                .then(datos => mostrarNoticias(datos));

            function mostrarNoticias(posts) {
                document.getElementById('loading').style.display = 'none';
                const contenedor = document.getElementById('noticias');

                posts.forEach(post => {
                const columna = document.createElement('div');
                columna.className = 'col-12 col-md-4';

                columna.innerHTML = `
                    <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title text-capitalize">${post.title}</h5>
                        <p class="card-text">${post.body}</p>
                    </div>
                    </div>
                `;
                contenedor.appendChild(columna);
                });
            }
        </script>
        

    </body>
</html>
